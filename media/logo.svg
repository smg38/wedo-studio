<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 500 100"
   width="500"
   height="100"
   version="1.1"
   id="svg40"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs14">
    <linearGradient
       id="mainGrad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#5798f3"
         id="stop2" />
      <stop
         offset="100%"
         stop-color="#3f2159"
         id="stop4" />
    </linearGradient>
    <linearGradient
       id="gearGrad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#2ECC71"
         id="stop7" />
      <stop
         offset="100%"
         stop-color="#16A085"
         id="stop9" />
    </linearGradient>
    <style
       id="style12">
      @keyframes move {
        0% { transform: translateX(0px); }
        50% { transform: translateX(15px); }
        100% { transform: translateX(0px); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .gear {
        animation: move 3s ease-in-out infinite, spin 4s linear infinite;
        transform-origin: 50px 40px;
      }
    </style>
    <linearGradient
       xlink:href="#mainGrad"
       id="linearGradient256"
       x1="18.308083"
       y1="22.182843"
       x2="67.343766"
       y2="71.218527"
       gradientTransform="scale(0.9340137,1.0706481)"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       xlink:href="#mainGrad"
       id="linearGradient258"
       x1="26.75"
       y1="36.75"
       x2="53.25"
       y2="63.25"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       xlink:href="#gearGrad"
       id="linearGradient260"
       x1="34"
       y1="24"
       x2="46"
       y2="36"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       xlink:href="#gearGrad"
       id="linearGradient262"
       x1="52"
       y1="36.5"
       x2="64"
       y2="48.5"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       xlink:href="#gearGrad"
       id="linearGradient264"
       x1="16"
       y1="36.5"
       x2="28"
       y2="48.5"
       gradientUnits="userSpaceOnUse" />
  </defs>
  <!-- Шестеренка ДВИЖЕТСЯ вправо-влево -->
  <g
     class="gear"
     id="g30"
     transform="translate(0.13193743,-17.569104)">
    <!-- Правильный шестиугольник R=25, центр 40,50 -->
    <polygon
       points="61.65,37.5 61.65,62.5 40,75 18.35,62.5 18.35,37.5 40,25 "
       fill="url(#mainGrad)"
       stroke="#2c3e50"
       stroke-width="2.5"
       stroke-linejoin="round"
       id="polygon16"
       style="fill:url(#linearGradient256)" />
    <!-- Ядро -->
    <circle
       cx="40"
       cy="50"
       r="12"
       fill="#ffffff"
       stroke="url(#mainGrad)"
       stroke-width="2.5"
       id="circle18"
       style="stroke:url(#linearGradient258)" />
    <!-- Код </> -->
    <path
       d="m 35,46 -4,4 4,4"
       stroke="#2c3e50"
       stroke-width="2.5"
       fill="none"
       stroke-linecap="round"
       stroke-linejoin="round"
       id="path20" />
    <path
       d="m 45,46 4,4 -4,4"
       stroke="#2c3e50"
       stroke-width="2.5"
       fill="none"
       stroke-linecap="round"
       stroke-linejoin="round"
       id="path22" />
    <!-- Точки-порты -->
    <circle
       cx="40"
       cy="30"
       r="5"
       fill="url(#gearGrad)"
       stroke="#2c3e50"
       stroke-width="2"
       id="circle24"
       style="fill:url(#linearGradient260)" />
    <circle
       cx="58"
       cy="42.5"
       r="5"
       fill="url(#gearGrad)"
       stroke="#2c3e50"
       stroke-width="2"
       id="circle26"
       style="fill:url(#linearGradient262)" />
    <circle
       cx="22"
       cy="42.5"
       r="5"
       fill="url(#gearGrad)"
       stroke="#2c3e50"
       stroke-width="2"
       id="circle28"
       style="fill:url(#linearGradient264)" />
  </g>
  <!-- Текст -->
  <g
     transform="translate(86.049356,50.365333)"
     id="g38">
    <text
       x="0"
       y="0"
       font-family="'Segoe UI', sans-serif"
       font-size="42px"
       font-weight="900"
       fill="#2c3e50"
       letter-spacing="1.5"
       id="text34">WeDo <tspan
   fill="url(#mainGrad)"
   id="tspan32">Studio</tspan></text>
    <text
       x="0"
       y="22"
       font-family="'Segoe UI', sans-serif"
       font-size="14px"
       font-weight="500"
       fill="#caaeff"
       letter-spacing="2"
       text-transform="uppercase"
       id="text36">Визуальное программирование</text>
  </g>
</svg>
