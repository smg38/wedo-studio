<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 500 100"
   width="500"
   height="100"
   version="1.1"
   id="svg40"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs14">
    <linearGradient
       id="mainGrad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#4C97FF"
         id="stop2" />
      <stop
         offset="100%"
         stop-color="#7B4CFF"
         id="stop4" />
    </linearGradient>
    <linearGradient
       id="gearGrad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#2ECC71"
         id="stop7" />
      <stop
         offset="100%"
         stop-color="#16A085"
         id="stop9" />
    </linearGradient>
    <style
       id="style12">
      @keyframes move {
        0% { transform: translateX(0px); }
        50% { transform: translateX(15px); }
        100% { transform: translateX(0px); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .gear {
        animation: move 3s ease-in-out infinite, spin 4s linear infinite;
        transform-origin: 40px 50px;
      }
    </style>
  </defs>
  <!-- Шестеренка ДВИЖЕТСЯ вправо-влево -->
  <g
     class="gear"
     id="g30">
    <!-- Правильный шестиугольник R=25, центр 40,50 -->
    <polygon
       points="40,25 61.65,37.5 61.65,62.5 40,75 18.35,62.5 18.35,37.5"
       fill="url(#mainGrad)"
       stroke="#2C3E50"
       stroke-width="2.5"
       stroke-linejoin="round"
       id="polygon16" />
    <!-- Ядро -->
    <circle
       cx="40"
       cy="50"
       r="12"
       fill="white"
       stroke="url(#mainGrad)"
       stroke-width="2.5"
       id="circle18" />
    <!-- Код </> -->
    <path
       d="M35,46 L31,50 L35,54"
       stroke="#2C3E50"
       stroke-width="2.5"
       fill="none"
       stroke-linecap="round"
       stroke-linejoin="round"
       id="path20" />
    <path
       d="M45,46 L49,50 L45,54"
       stroke="#2C3E50"
       stroke-width="2.5"
       fill="none"
       stroke-linecap="round"
       stroke-linejoin="round"
       id="path22" />
    <!-- Точки-порты -->
    <circle
       cx="40"
       cy="30"
       r="5"
       fill="url(#gearGrad)"
       stroke="#2C3E50"
       stroke-width="2"
       id="circle24" />
    <circle
       cx="58"
       cy="42.5"
       r="5"
       fill="url(#gearGrad)"
       stroke="#2C3E50"
       stroke-width="2"
       id="circle26" />
    <circle
       cx="22"
       cy="42.5"
       r="5"
       fill="url(#gearGrad)"
       stroke="#2C3E50"
       stroke-width="2"
       id="circle28" />
  </g>
  <!-- Текст -->
  <g
     transform="translate(86.049356,50.365333)"
     id="g38">
    <text
       x="0"
       y="0"
       font-family="'Segoe UI', sans-serif"
       font-size="32px"
       font-weight="900"
       fill="#2c3e50"
       letter-spacing="1.5"
       id="text34">WeDo <tspan
   fill="url(#mainGrad)"
   id="tspan32">Studio</tspan></text>
    <text
       x="0"
       y="22"
       font-family="'Segoe UI', sans-serif"
       font-size="11px"
       font-weight="500"
       fill="#7f8c8d"
       letter-spacing="2"
       text-transform="uppercase"
       id="text36">Визуальное программирование</text>
  </g>
</svg>
