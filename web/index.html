<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeDo Studio v2.5</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<!-- Blockly Core -->
<script src="lib/blockly/blockly_compressed.js"></script>
<script src="lib/blockly/blocks_compressed.js"></script>
<script src="lib/blockly/javascript_compressed.js"></script>
<script src="lib/blockly/msg/ru.js"></script>

<!-- YAML Parser -->
<script src="lib/js-yaml.min.js"></script>
<script>window.yaml = window.jsyaml;</script>

<!-- Наши компоненты -->
<script src="js/wedo-ble-driver.js"></script>
<script src="js/wedo-blocks.js"></script>
<script src="js/wedo-generator.js"></script>
<script src="js/wedo-project-io.js"></script> <!-- НОВЫЙ ФАЙЛ -->
<script src="js/wedo-app.js"></script>       <!-- ЛОГИКА ПРИЛОЖЕНИЯ -->

<style>
body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; background: #f0f4f8; user-select: none; -webkit-user-select: none; }
#blocklyDiv { flex: 1; height: 100%; }
#sidebar { width: 340px; background: white; padding: 20px; box-shadow: -2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; pointer-events: auto; }
h2 { margin-top: 0; color: #4C97FF; font-size: 1.2rem; }
button { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; font-size: 14px; }
.btn-run { background: #4C97FF; } .btn-stop { background: #FF4C4C; }
.btn-connect { background: #2ECC71; } .btn-save { background: #F39C12; } .btn-load { background: #9B59B6; }
.btn-group { display: flex; gap: 5px; } .btn-group button { flex: 1; }
#log { flex: 1; background: #222; color: #0f0; padding: 10px; font-family: monospace; overflow-y: auto; border-radius: 4px; font-size: 12px; min-height: 80px; }
.status-bar { font-size: 11px; color: #888; text-align: center; margin-top: 5px; }
#hub-info-panel { background: #e8f4fd; border-left: 4px solid #4C97FF; padding: 12px; border-radius: 4px; display: none; font-size: 13px; }
#hub-info-panel h4 { margin: 0 0 8px 0; color: #333; font-size: 14px; }
.info-row { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px dashed #ccc; padding-bottom: 2px; }
.info-label { font-weight: bold; color: #555; } .info-value { color: #000; }
</style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S4KRPFJY9G"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-S4KRPFJY9G');
</script>
<body>
<div id="blocklyDiv"></div>
<div id="sidebar">
    <h2>WeDo Studio v2.5</h2>
    <!-- Вставьте этот блок внутрь <div id="sidebar"> сразу после <h2> -->
    <div style="margin-bottom: 10px;">
        <label for="project-name" style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Название проекта:</label>
        <input type="text" id="project-name" placeholder="Моя первая программа" 
            style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;">
    </div>
    <div id="hub-info-panel">
        <h4> Информация о хабе</h4>
        <div class="info-row"><span class="info-label">Имя:</span> <span class="info-value" id="h-name">-</span></div>
        <div class="info-row"><span class="info-label">Прошивка:</span> <span class="info-value" id="h-fw">-</span></div>
        <div class="info-row"><span class="info-label">Производитель:</span> <span class="info-value" id="h-mfr">-</span></div>
        <div class="info-row"><span class="info-label">Питание:</span> <span class="info-value" id="h-pwr">-</span></div>
        <div class="info-row"><span class="info-label">Заряд:</span> <span class="info-value" id="h-bat">-</span></div>
    </div>
    <button class="btn-connect" onclick="app.connect()">🔌 Подключить хаб</button>
    <div class="btn-group">
        <button class="btn-run" onclick="app.run()">🏁 Запуск</button>
        <button class="btn-stop" onclick="app.stop()">⏹️ Стоп</button>
    </div>
    <div class="btn-group">
        <button class="btn-save" onclick="app.save()">💾 Сохранить</button>
        <button class="btn-load" onclick="document.getElementById('fileInput').click()">📂 Загрузить</button>
        <input type="file" id="fileInput" accept=".yaml" style="display:none" onchange="app.load(this)">
    </div>
    <div id="log">Готов к работе...</div>
    <div class="status-bar">Chrome + localhost | Author: smg38 | Apache 2.0</div>
</div>
<script>

});
console.log('%c⛔ Исходный код защищен авторским правом smg38 (Apache 2.0)', 'color:red; font-size:20px; font-weight:bold;');
</script>
</body>
</html>
